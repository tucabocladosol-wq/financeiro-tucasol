<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro Tucasol</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    color: #222;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #172033;
    color: white;
    padding: 25px 15px;
    overflow-y: auto;
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo h1 {
    font-size: 24px;
}

.logo span {
    color: #f5c542;
    font-size: 13px;
}

.menu button {
    width: 100%;
    border: none;
    background: transparent;
    color: #dce1ea;
    padding: 14px;
    text-align: left;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    font-size: 15px;
}

.menu button:hover,
.menu button.active {
    background: #263550;
    color: white;
}

/* =========================
   CONTEÚDO
========================= */

.main {
    margin-left: 240px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h2 {
    font-size: 28px;
}

.header p {
    color: #777;
    margin-top: 5px;
}

/* =========================
   CARDS
========================= */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card-title {
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
}

.card-value {
    font-size: 26px;
    font-weight: bold;
}

.positive {
    color: #159957;
}

.negative {
    color: #d64545;
}

.warning {
    color: #d89b00;
}

/* =========================
   SEÇÕES
========================= */

.section {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
    margin-bottom: 25px;
}

.section h3 {
    margin-bottom: 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

/* =========================
   TABELAS
========================= */

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #666;
    font-size: 13px;
}

/* =========================
   STATUS
========================= */

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
}

.status-pago {
    background: #dff5e8;
    color: #159957;
}

.status-pendente {
    background: #fff1cc;
    color: #a66d00;
}

.status-atrasado {
    background: #ffe0e0;
    color: #c33;
}

/* =========================
   BOTÕES
========================= */

.btn {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.btn-primary {
    background: #172033;
    color: white;
}

.btn-primary:hover {
    background: #263550;
}

.btn-success {
    background: #159957;
    color: white;
}

.btn-danger {
    background: #d64545;
    color: white;
}

.btn-secondary {
    background: #ddd;
    color: #333;
}

/* =========================
   FORMULÁRIO
========================= */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: bold;
    color: #555;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #172033;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(700px, 92%);
    background: white;
    border-radius: 15px;
    padding: 25px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 22px;
}

.close-modal {
    border: none;
    background: transparent;
    font-size: 25px;
    cursor: pointer;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #888;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 1000px) {

    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 700px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .header {
        display: block;
    }

    .header strong {
        display: block;
        margin-top: 10px;
    }

    table {
        font-size: 13px;
    }

}

</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<aside class="sidebar">

    <div class="logo">
        <h1>☀️ TUCASOL</h1>
        <span>FINANCEIRO</span>
    </div>

    <div class="menu">

        <button class="menu-btn active" data-page="dashboard">
            🏠 Dashboard
        </button>

        <button class="menu-btn" data-page="receitas">
            💰 Receitas
        </button>

        <button class="menu-btn" data-page="despesas">
            💸 Despesas
        </button>

        <button class="menu-btn" data-page="receber">
            📥 Contas a Receber
        </button>

        <button class="menu-btn" data-page="pagar">
            📤 Contas a Pagar
        </button>

        <button class="menu-btn" data-page="eventos">
            🎪 Eventos
        </button>

        <button class="menu-btn" data-page="doacoes">
            🎁 Doações
        </button>

        <button class="menu-btn" data-page="relatorios">
            📊 Relatórios
        </button>

        <button class="menu-btn" data-page="configuracoes">
            ⚙️ Configurações
        </button>

    </div>

</aside>

<!-- =========================
     CONTEÚDO
========================= -->

<main class="main">

    <div class="header">

        <div>
            <h2 id="tituloPagina">Dashboard Financeiro</h2>

            <p id="subtituloPagina">
                Visão geral das movimentações do Tucasol
            </p>
        </div>

        <div>
            <strong id="dataAtual"></strong>
        </div>

    </div>

    <!-- DASHBOARD -->

    <div id="paginaDashboard">

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    💰 Receitas do mês
                </div>

                <div id="cardReceitas" class="card-value positive">
                    R$ 0,00
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    💸 Despesas do mês
                </div>

                <div id="cardDespesas" class="card-value negative">
                    R$ 0,00
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    💵 Saldo atual
                </div>

                <div id="cardSaldo" class="card-value">
                    R$ 0,00
                </div>

            </div>

            <div class="card">

                <div class="card-title">
                    ⏰ Em aberto
                </div>

                <div id="cardAberto" class="card-value warning">

                </div>

            </div>

        </div>

        <div class="section">

            <h3>📋 Últimas movimentações</h3>

            <div id="movimentacoes">

        <div class="section">

    <!-- OUTRAS PÁGINAS -->

</main>


<!-- =========================
     MODAL NOVO REGISTRO
========================= -->

<div id="modalRegistro" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2 id="tituloModal">
                Novo registro
            </h2>

            <button
                class="close-modal"
                onclick="fecharModal()">
                ×
            </button>

        </div>

        <form id="formRegistro">

            <input
                type="hidden"
                id="campoTipo">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Data
                    </label>

                    <input
                        type="date"
                        id="campoData"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="campoStatus">

                        <option value="Pago">
                            Pago
                        </option>

                        <option value="Pendente">
                            Pendente
                        </option>

                        <option value="Atrasado">
                            Atrasado
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Descrição
                    </label>

                    <input
                        type="text"
                        id="campoDescricao"
                        placeholder="Ex.: Venda de ingresso"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Categoria
                    </label>

                    <input
                        type="text"
                        id="campoCategoria"
                        placeholder="Ex.: Evento">

                </div>


                <div class="form-group">

                    <label>
                        Evento
                    </label>

                    <input
                        type="text"
                        id="campoEvento"
                        placeholder="Ex.: Espetinho do Seu Zé">

                </div>


                <div class="form-group">

                    <label>
                        Valor
                    </label>

                    <input
                        type="number"
                        id="campoValor"

                    Cancelar
                </button>

                <button

                    class="btn btn-success"
                    id="btnSalvar">
                    💾 Salvar registro
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwWWFWn6nMHY-0tq48tmSrM72ZLgpoKR_N_BrvXqw5C9Wvy6tee78j5eryBOeTj693g1g/exec";


let paginaAtual = "dashboard";


/* =====================================================
   UTILITÁRIOS
===================================================== */

function moeda(valor) {

    const numero = Number(valor) || 0;

    return numero.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });

}


function escapeHtml(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function statusHtml(status) {

    const texto = status || "Pendente";

    const normalizado =
        texto.toString().toLowerCase();

    let classe = "status-pendente";

    if (normalizado.includes("pago")) {
        classe = "status-pago";
    }

    if (
        normalizado.includes("atras")
    ) {
        classe = "status-atrasado";
    }

    return `
        <span class="status ${classe}">
            ${escapeHtml(texto)}
        </span>
    `;

}


/* =====================================================
   COMUNICAÇÃO COM APPS SCRIPT
===================================================== */

async function apiGet(params = {}) {

    const url = new URL(API_URL);

    Object.entries(params).forEach(([chave, valor]) => {

        if (
            valor !== undefined &&
            valor !== null &&
            valor !== ""
        ) {

            url.searchParams.set(chave, valor);

        }

    });


    const resposta = await fetch(
        url.toString(),
        {
            method: "GET",
            cache: "no-store"
        }
    );


    if (!resposta.ok) {

        throw new Error(
            "Erro HTTP " + resposta.status
        );

    }


    const dados = await resposta.json();

    return dados;

}


/* =====================================================
   TESTE DE CONEXÃO
===================================================== */

async function testarConexao() {

    try {

        const dados =
            await apiGet({
                action: "teste"
            });

        console.log(
            "Conexão Apps Script:",
            dados
        );

        return dados;

    } catch (erro) {

        console.error(
            "Erro na conexão:",
            erro
        );

        return null;

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

async function carregarDashboard() {

    try {

        const dados =
            await apiGet({
                action: "dashboard"
            });

        console.log(
            "Dashboard recebido:",
            dados
        );


        if (
            dados &&
            dados.sucesso === false
        ) {

            throw new Error(
                dados.mensagem ||
                "Erro ao carregar dashboard."
            );

        }


        const resultado =
            dados.dados ||
            dados.dashboard ||
            dados;


        const receitas =
            resultado.receitas ??
            resultado.receitasMes ??
            resultado.totalReceitas ??
            0;


        const despesas =
            resultado.despesas ??
            resultado.despesasMes ??
            resultado.totalDespesas ??
            0;


        const saldo =
            resultado.saldo ??
            resultado.saldoAtual ??
            (Number(receitas) - Number(despesas));


        const aberto =
            resultado.aberto ??
            resultado.emAberto ??
            resultado.contasAbertas ??
            0;


        document.getElementById(
            "cardReceitas"
        ).textContent = moeda(receitas);


        document.getElementById(
            "cardDespesas"
        ).textContent = moeda(despesas);


        document.getElementById(
            "cardSaldo"
        ).textContent = moeda(saldo);


        document.getElementById(
            "cardAberto"
        ).textContent = moeda(aberto);


        carregarMovimentacoes(
            resultado.movimentacoes ||
            resultado.ultimas ||
            resultado.ultimasMovimentacoes ||
            []
        );


        carregarVencimentos(
            resultado.vencimentos ||
            resultado.proximosVencimentos ||
            []
        );


    } catch (erro) {

        console.error(
            "Erro dashboard:",
            erro
        );

        document.getElementById(
            "movimentacoes"
        ).innerHTML = `
            <div class="empty">
                Não foi possível carregar os dados.
            </div>
        `;

        document.getElementById(
            "vencimentos"
        ).innerHTML = `
            <div class="empty">
                Não foi possível carregar os dados.
            </div>
        `;

    }

}


/* =====================================================
   MOVIMENTAÇÕES
===================================================== */

function carregarMovimentacoes(lista) {

    if (
        !Array.isArray(lista) ||
        lista.length === 0
    ) {

        document.getElementById(
            "movimentacoes"
        ).innerHTML = `
            <div class="empty">
                Nenhuma movimentação encontrada.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Evento</th>
                    <th>Valor</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(item => {

        html += `

            <tr>

                <td>
                    ${escapeHtml(
                        item.data ||
                        item.Data ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.descricao ||
                        item.Descricao ||
                        item.descrição ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.categoria ||
                        item.Categoria ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.evento ||
                        item.Evento ||
                        ""
                    )}
                </td>

                <td>
                    ${moeda(
                        item.valor ||
                        item.Valor ||
                        0
                    )}
                </td>

                <td>
                    ${statusHtml(
                        item.status ||
                        item.Status
                    )}
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    document.getElementById(
        "movimentacoes"
    ).innerHTML = html;

}


/* =====================================================
   VENCIMENTOS
===================================================== */

function carregarVencimentos(lista) {

    if (
        !Array.isArray(lista) ||
        lista.length === 0
    ) {

        document.getElementById(
            "vencimentos"
        ).innerHTML = `
            <div class="empty">
                Nenhum vencimento encontrado.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Vencimento</th>
                    <th>Descrição</th>
                    <th>Responsável</th>
                    <th>Valor</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

    `;


    lista.forEach(item => {

        html += `

            <tr>

                <td>
                    ${escapeHtml(
                        item.data ||
                        item.vencimento ||
                        item.Vencimento ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.descricao ||
                        item.Descricao ||
                        ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.responsavel ||
                        item.Responsavel ||
                        ""
                    )}
                </td>

                <td>
                    ${moeda(
                        item.valor ||
                        item.Valor ||
                        0
                    )}
                </td>

                <td>
                    ${statusHtml(
                        item.status ||
                        item.Status
                    )}
                </td>

            </tr>

        `;

    });


    html += `
            </tbody>
        </table>
    `;


    document.getElementById(
        "vencimentos"
    ).innerHTML = html;

}


/* =====================================================
   ABRIR FORMULÁRIO
===================================================== */

function abrirFormularioRegistro(tipo) {

    document.getElementById(
        "campoTipo"
    ).value = tipo;


    let titulo = "Novo registro";


    if (tipo === "RECEITA") {
        titulo = "Nova Receita";
    }

    if (tipo === "DESPESA") {
        titulo = "Nova Despesa";
    }

    if (tipo === "CONTAS_RECEBER") {
        titulo = "Nova Conta a Receber";
    }

    if (tipo === "CONTAS_PAGAR") {
        titulo = "Nova Conta a Pagar";
    }

    if (tipo === "EVENTO") {
        titulo = "Novo Evento";
    }

    if (tipo === "DOACAO") {
        titulo = "Nova Doação";
    }


    document.getElementById(
        "tituloModal"
    ).textContent = titulo;


    document.getElementById(
        "campoData"
    ).value =
        new Date().toISOString().split("T")[0];


    document.getElementById(
        "modalRegistro"
    ).classList.add("show");

}


/* =====================================================
   FECHAR MODAL
===================================================== */

function fecharModal() {

    document.getElementById(
        "modalRegistro"
    ).classList.remove("show");

    document.getElementById(
        "formRegistro"
    ).reset();

}


/* =====================================================
   SALVAR REGISTRO
===================================================== */

async function salvarRegistro(event) {

    event.preventDefault();


    const btn =
        document.getElementById("btnSalvar");


    const registro = {

        tipo:
            document.getElementById(
                "campoTipo"
            ).value,

        data:
            document.getElementById(
                "campoData"
            ).value,

        descricao:
            document.getElementById(
                "campoDescricao"
            ).value.trim(),

        categoria:
            document.getElementById(
                "campoCategoria"
            ).value.trim(),

        evento:
            document.getElementById(
                "campoEvento"
            ).value.trim(),

        valor:
            document.getElementById(
                "campoValor"
            ).value,

        status:
            document.getElementById(
                "campoStatus"
            ).value

    };


    if (
        !registro.data ||
        !registro.descricao ||
        !registro.valor
    ) {

        alert(
            "Preencha Data, Descrição e Valor."
        );

        return;

    }


    btn.disabled = true;

    btn.textContent =
        "⏳ Salvando...";


    try {

        /*
         * Envia os dados para o Apps Script.
         *
         * O backend recebe:
         *
         * action=salvar
         * tipo
         * data
         * descricao
         * categoria
         * evento
         * valor
         * status
         */

        const dados =
            await apiGet({

                action: "salvar",

                tipo: registro.tipo,

                data: registro.data,

                descricao:
                    registro.descricao,

                categoria:
                    registro.categoria,

                evento:
                    registro.evento,

                valor:
                    registro.valor,

                status:
                    registro.status

            });


        console.log(
            "Resposta do Apps Script:",
            dados
        );


        if (
            dados &&
            dados.sucesso === false
        ) {

            throw new Error(
                dados.mensagem ||
                "O Apps Script recusou o registro."
            );

        }


        alert(
            "✅ Registro salvo com sucesso!"
        );


        fecharModal();


        /*
         * Atualiza o Dashboard
         * imediatamente após salvar.
         */

        await carregarDashboard();


        /*
         * Se estiver em uma página de lista,
         * recarrega também.
         */

        if (
            paginaAtual !== "dashboard"
        ) {

            carregarPagina(
                paginaAtual
            );

        }


    } catch (erro) {

        console.error(
            "Erro ao salvar:",
            erro
        );


        alert(
            "❌ Não foi possível salvar o registro.\n\n" +
            erro.message
        );


    } finally {

        btn.disabled = false;

        btn.textContent =
            "💾 Salvar registro";

    }

}


/* =====================================================
   CARREGAR LISTA DE UMA CATEGORIA
===================================================== */

async function carregarLista(tipo, titulo) {

    const container =
        document.getElementById(
            "paginaConteudo"
        );


    container.innerHTML = `
        <div class="section">

            <div class="loading">
                ⏳ Carregando dados...
            </div>

        </div>
    `;


    try {

        const dados =
            await apiGet({

                action: "listar",

                tipo: tipo

            });


        console.log(
            "Lista recebida:",
            dados
        );


        const lista =
            dados.dados ||
            dados.registros ||
            dados.lista ||
            (Array.isArray(dados)
                ? dados
                : []);


        let html = `

            <div class="section">

                <div class="section-header">

                    <h3>
                        ${titulo}
                    </h3>

                    <button
                        class="btn btn-primary"
                        onclick="abrirFormularioRegistro('${tipo}')">

                        + Novo registro

                    </button>

                </div>

        `;


        if (
            !Array.isArray(lista) ||
            lista.length === 0
        ) {

            html += `
                <div class="empty">
                    Nenhum registro encontrado.
                </div>
            `;

        } else {

            html += `

                <table>

                    <thead>

                        <tr>

                            <th>Data</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Evento</th>
                            <th>Valor</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

            `;


            lista.forEach(item => {

                html += `

                    <tr>

                        <td>
                            ${escapeHtml(
                                item.data ||
                                item.Data ||
                                ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                item.descricao ||
                                item.Descricao ||
                                ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                item.categoria ||
                                item.Categoria ||
                                ""
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                item.evento ||
                                item.Evento ||
                                ""
                            )}
                        </td>

                        <td>
                            ${moeda(
                                item.valor ||
                                item.Valor ||
                                0
                            )}
                        </td>

                        <td>
                            ${statusHtml(
                                item.status ||
                                item.Status
                            )}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;

        }


        html += `
            </div>
        `;


        container.innerHTML = html;


    } catch (erro) {

        console.error(
            erro
        );


        container.innerHTML = `

            <div class="section">

                <div class="empty">

                    ❌ Erro ao carregar os dados.

                    <br><br>

                    ${escapeHtml(
                        erro.message
                    )}

                </div>

            </div>

        `;

    }

}


/* =====================================================
   CARREGAR PÁGINA
===================================================== */

function carregarPagina(pagina) {

    paginaAtual = pagina;


    document.getElementById(
        "paginaDashboard"
    ).style.display =
        pagina === "dashboard"
            ? "block"
            : "none";


    document.getElementById(
        "paginaConteudo"
    ).style.display =
        pagina === "dashboard"
            ? "none"
            : "block";


    const titulos = {

        dashboard: [
            "Dashboard Financeiro",
            "Visão geral das movimentações do Tucasol"
        ],

        receitas: [
            "Receitas",
            "Controle das entradas financeiras"
        ],

        despesas: [
            "Despesas",
            "Controle das saídas financeiras"
        ],

        receber: [
            "Contas a Receber",
            "Valores que o Tucasol tem a receber"
        ],

        pagar: [
            "Contas a Pagar",
            "Valores que o Tucasol precisa pagar"
        ],

        eventos: [
            "Eventos",
            "Movimentações financeiras por evento"
        ],

        doacoes: [
            "Doações",
            "Controle das doações recebidas"
        ],

        relatorios: [
            "Relatórios",
            "Visão analítica do financeiro"
        ],

        configuracoes: [
            "Configurações",
            "Configurações do sistema"
        ]

    };


    const info =
        titulos[pagina] ||
        titulos.dashboard;


    document.getElementById(
        "tituloPagina"
    ).textContent = info[0];


    document.getElementById(
        "subtituloPagina"
    ).textContent = info[1];


    if (pagina === "dashboard") {

        carregarDashboard();

        return;

    }


    const mapas = {

        receitas: {
            tipo: "RECEITA",
            titulo: "💰 Receitas"
        },

        despesas: {
            tipo: "DESPESA",
            titulo: "💸 Despesas"
        },

        receber: {
            tipo: "CONTAS_RECEBER",
            titulo: "📥 Contas a Receber"
        },

        pagar: {
            tipo: "CONTAS_PAGAR",
            titulo: "📤 Contas a Pagar"
        },

        eventos: {
            tipo: "EVENTO",
            titulo: "🎪 Eventos"
        },

        doacoes: {
            tipo: "DOACAO",
            titulo: "🎁 Doações"
        }

    };


    if (mapas[pagina]) {

        carregarLista(
            mapas[pagina].tipo,
            mapas[pagina].titulo
        );

        return;

    }


    if (pagina === "relatorios") {

        document.getElementById(
            "paginaConteudo"
        ).innerHTML = `

            <div class="section">

                <h3>📊 Relatórios</h3>

                <div class="empty">

                    Área de relatórios será integrada
                    aos dados reais do Google Sheets.

                </div>

            </div>

        `;

        return;

    }


    if (pagina === "configuracoes") {

        document.getElementById(
            "paginaConteudo"
        ).innerHTML = `

            <div class="section">

                <h3>⚙️ Configurações</h3>

                <p>
                    Sistema conectado ao Google Apps Script.
                </p>

                <br>

                <button
                    class="btn btn-primary"
                    onclick="testarConexaoComMensagem()">

                    🔌 Testar conexão

                </button>

            </div>

        `;

    }

}


/* =====================================================
   TESTAR CONEXÃO COM MENSAGEM
===================================================== */

async function testarConexaoComMensagem() {

    const dados =
        await testarConexao();


    if (
        dados &&
        dados.sucesso !== false
    ) {

        alert(
            "✅ Conexão com o Google Sheets funcionando!"
        );

    } else {

        alert(
            "❌ Não foi possível confirmar a conexão."
        );

    }

}


/* =====================================================
   MENU
===================================================== */

document
    .querySelectorAll(".menu-btn")
    .forEach(botao => {

        botao.addEventListener(
            "click",
            function() {

                document
                    .querySelectorAll(".menu-btn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );


                this.classList.add("active");


                const pagina =
                    this.dataset.page;


                carregarPagina(
                    pagina
                );

            }
        );

    });

   FORMULÁRIO
===================================================== */

document
    .getElementById("formRegistro")
    .addEventListener(
        "submit",
        salvarRegistro
    );

   FECHAR MODAL CLICANDO FORA

document
    .getElementById("modalRegistro")
    .addEventListener(

            if (
                event.target === this
            ) {

                fecharModal();

            }

        }
    );


/* =====================================================
   DATA ATUAL
===================================================== */

function atualizarData() {

    const hoje =
        new Date();


    document.getElementById(
        "dataAtual"
    ).textContent =
        hoje.toLocaleDateString(
            "pt-BR"
        );

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

async function iniciarSistema() {

    atualizarData();


    await testarConexao();


    await carregarDashboard();

}


iniciarSistema();

</script>
